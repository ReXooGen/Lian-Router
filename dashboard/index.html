    <meta name="twitter:title" content="LianRouter — One Stop OpenAI &amp; Anthropic Proxy Router" />
    <meta
      name="twitter:description"
      content="One self-hosted gateway for OpenAI, Anthropic and 40 provider adapters. Powered by Elysia + Bun."
    />
    <meta name="twitter:image" content="/og_image.webp" />
    <meta name="twitter:image:alt" content="LianRouter — One Stop OpenAI &amp; Anthropic Proxy Router" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
    <style>
      html { background: #000; }
      html[data-app="console"] { background: #fffdf8; }
      html[data-app="console"][data-theme="dark"] { background: #08080b; }
      @media (prefers-color-scheme: dark) {
        html[data-app="console"][data-theme="system"] { background: #08080b; }
      }
    </style>
    <script>
      // This bootstrap mirrors dashboard/src/lib/theme.ts because it must run
      // before the selected app chunk loads. Keep the /console and /share
      // predicates, storage keys, and accepted values in sync with TypeScript.
      (() => {
        const pathname = window.location.pathname;
        const isShare = pathname === "/share" || pathname.startsWith("/share/");
        const isConsole = pathname === "/" || pathname === "/console" || pathname.startsWith("/console/");
        const root = document.documentElement;
        root.dataset.app = isShare ? "share" : isConsole ? "console" : "landing";
        const themeMeta = document.querySelector('meta[name="theme-color"]');
        const colorSchemeMeta = document.createElement("meta");
        colorSchemeMeta.name = "color-scheme";
        colorSchemeMeta.content = isConsole ? "light dark" : "dark";
        document.head.appendChild(colorSchemeMeta);
        document.title = isShare
          ? "LianRouter — Shared access"
          : "LianRouter Console";
        if (themeMeta) themeMeta.setAttribute("content", isConsole ? "#09090b" : "#000000");
        if (!isConsole) return;
        try {
          const storedTheme = window.localStorage.getItem("console-theme");
          const choice =
            storedTheme === "light" || storedTheme === "dark" || storedTheme === "system"
              ? storedTheme
              : "dark";
          // Resolve "system" here rather than in CSS: the console tokens are a
          // single `[data-theme="dark"]` block, so an unresolved "system" value
          // would match neither arm and silently render light.
          root.dataset.theme =
            choice === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : choice;
        } catch {
          root.dataset.theme = "dark";
        }
        try {
          if (window.localStorage.getItem("console-ambient-glow") === "off") {
            root.dataset.ambientGlow = "off";
          }
        } catch {
          // Ambient glow stays on by default when storage is unavailable.
        }
      })();
    </script>
    <title>LianRouter</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
